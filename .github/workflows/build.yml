name: Build Installer

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install MSVC build tools
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Tauri CLI
        shell: pwsh
        run: cargo install tauri-cli --version "^2" --locked

      - name: Install 7-Zip
        shell: pwsh
        run: choco install 7zip -y --no-progress

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $isSetup = "$env:TEMP\innosetup.exe"
          Invoke-WebRequest -Uri "https://jrsoftware.org/download.php/is.exe" -OutFile $isSetup
          Start-Process $isSetup -ArgumentList '/VERYSILENT /NORESTART /DIR="$env:ProgramFiles(x86)\Inno Setup 6"' -Wait
          $iscc = "$env:ProgramFiles(x86)\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "ISCC.exe not found at $iscc"
          }

      - name: Install libmpv dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location livewall

          New-Item -ItemType Directory -Force vendor | Out-Null

          $url = "https://github.com/shinchiro/mpv-winbuild-cmake/releases/download/20261021/mpv-dev-x86_64-20261021-git-e471496c56.7z"
          $archive = "$PWD\mpv.7z"

          Invoke-WebRequest -Uri $url -OutFile $archive
          7z x $archive -o"$PWD\vendor" -y

          if (-not (Test-Path "$PWD\vendor\libmpv-2.dll")) {
            throw "libmpv-2.dll was not found in vendor after extraction."
          }

      - name: Build Application
        shell: pwsh
        run: |
          Set-Location livewall
          powershell ./tools/build.ps1

      - name: Upload Executables
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper
          path: |
            livewall/dist/*.exe
            livewall/target/release/*.exe
