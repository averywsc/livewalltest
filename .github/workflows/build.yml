name: Build Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Application
        run: |
          cd livewall
          cargo build --release

      - name: Upload Executables
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper
          path: livewall/target/release/*.exe
