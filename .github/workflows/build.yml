name: Build Installer

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install libmpv dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Set-Location livewall

          New-Item -ItemType Directory -Force vendor | Out-Null

          # Replace this with the actual LGPL x86_64 libmpv dev release asset you want to use.
          # Example source from README: shinchiro mpv-winbuild-cmake releases.
          $url = "https://example.invalid/mpv-dev-lgpl-x86_64.7z"

          Invoke-WebRequest -Uri $url -OutFile mpv.7z
          7z x mpv.7z -o"$PWD\vendor" -y

          if (-not (Test-Path "$PWD\vendor\libmpv-2.dll")) {
            throw "libmpv-2.dll was not found in vendor after extraction."
          }

      - name: Build Application
        shell: pwsh
        run: |
          Set-Location livewall
          powershell ./tools/build.ps1

      - name: Upload Executables
        uses: actions/upload-artifact@v4
        with:
          name: LiveWallpaper
          path: |
            livewall/dist/*.exe
            livewall/target/release/*.exe
